<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1026">
  <title>C.I.FIPE</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/cifipe-180.png">
  <script defer src="./instalacao.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; color: #f6f3ff; font-family: "Segoe UI", Arial, sans-serif; background: radial-gradient(ellipse at 25% 45%, #200538 0, transparent 55%), linear-gradient(120deg, #06091f, #090721); }
    main { min-height: 100dvh; max-width: 1200px; margin: auto; padding: 48px 28px; display: grid; grid-template-columns: 1fr 1.2fr; gap: 72px; align-items: center; }
    header { text-align: center; }
    header img { width: 160px; height: 160px; border-radius: 24px; box-shadow: 0 0 20px #00d8ed40; }
    .categoria { margin: 22px 0 12px; color: #00d8ed; font-size: 15px; font-weight: 700; letter-spacing: 4px; }
    h1 { margin: 0; font-size: clamp(36px, 5vw, 58px); }
    header p:last-child { max-width: 360px; margin: 22px auto 0; font-size: 22px; line-height: 1.45; color: #cbd6f2; }
    nav { display: grid; gap: 24px; }
    nav a { display: flex; align-items: center; gap: 22px; min-height: 158px; padding: 30px 26px; border: 2px solid #00d8ed; border-radius: 22px; color: inherit; text-decoration: none; background: linear-gradient(120deg, #06132a, #090b24); box-shadow: 0 0 18px #00d8ed20; }
    nav a:last-child { border-color: #f126d4; background: linear-gradient(120deg, #20051e, #18051e); box-shadow: 0 0 18px #f126d420; }
    .icone { width: 68px; height: 72px; padding: 14px; border: 2px solid currentColor; border-radius: 14px; color: #00d8ed; flex-shrink: 0; }
    nav a:last-child .icone { color: #f126d4; }
    strong { display: block; font-size: 26px; }
    nav p { margin: 7px 0 0; font-size: 18px; line-height: 1.4; color: #cbd6f2; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 6px; }
    @media(max-width: 760px) { main { grid-template-columns: 1fr; gap: 36px; padding: 34px 22px; } header img { width: 110px; height: 110px; } header p:last-child { font-size: 18px; } nav a { min-height: 130px; padding: 22px 18px; gap: 18px; } strong { font-size: 22px; } nav p { font-size: 16px; } .icone { width: 58px; height: 62px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="./icons/cifipe-192.png" alt="Ícone C.I.FIPE" width="160" height="160">
      <p class="categoria">CAMPO · CONSULTA</p>
      <h1>C.I.FIPE</h1>
      <p>Arquivos da obra, do campo ao dashboard.</p>
    </header>
    <nav aria-label="Acessos do C.I.FIPE">
      <a href="./dashboard.html">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 21V14H7V21ZM10 21V9H14V21ZM17 21V3H21V21Z"/></svg>
        <div><strong>Consultar dashboard</strong><p>Mapas, indicadores e vistorias.</p></div>
      </a>
      <a href="https://cifipe-pwa-teste.davidsmjr.chatgpt.site/">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 16H21M5 16V12A7 7 0 0 1 19 12V16M10 10V3H14V10M5 21H19"/></svg>
        <div><strong>Operador de campo</strong><p>Envio de arquivos e gerenciamento de obras.</p></div>
      </a>
    </nav>
  </main>
</body>
</html>
